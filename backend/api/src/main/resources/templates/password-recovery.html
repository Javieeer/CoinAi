<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperación de contraseña</title>
</head>

<body style="font-family: Arial, Helvetica, sans-serif; background:#f5f5f5; padding:40px;">

<div style="max-width:600px; margin:auto; background:white; border-radius:12px; padding:40px;">

    <h2>Hola {{name}} 👋</h2>

    <p>
        Recibimos una solicitud para restablecer la contraseña de tu cuenta de CoinAI.
    </p>

    <p>
        Si fuiste tú, presiona el siguiente botón:
    </p>

    <p style="text-align:center;margin:40px 0;">

        <a href="{{link}}"
           style="
            background:#2563eb;
            color:white;
            padding:14px 24px;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
           ">
            Restablecer contraseña
        </a>

    </p>

    <p>
        Si no solicitaste este cambio puedes ignorar este correo.
    </p>

    <hr>

    <small>
        CoinAI
    </small>

</div>

</body>
</html>
